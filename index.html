<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tippy — Your Suggestion Buddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0a0a12;
      --bg-card: #12121f;
      --bg-bubble-user: linear-gradient(135deg, #6366f1, #8b5cf6);
      --bg-bubble-bot: #1e1e2e;
      --accent: #a78bfa;
      --accent-glow: #c4b5fd;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: rgba(167, 139, 250, 0.2);
      --success: #34d399;
      --pink: #f472b6;
      --cyan: #22d3ee;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-deep);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .bg-particles {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.3;
      animation: float-up 12s infinite ease-in-out;
    }
    .particle:nth-child(odd) { background: var(--pink); }
    .particle:nth-child(3n) { background: var(--cyan); width: 4px; height: 4px; }
    .particle:nth-child(4n) { width: 8px; height: 8px; opacity: 0.2; }

    @keyframes float-up {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 0.4; }
      90% { opacity: 0.3; }
      100% { transform: translateY(-20vh) scale(1); opacity: 0; }
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      height: 92vh;
      max-height: 820px;
      background: var(--bg-card);
      border-radius: 28px;
      border: 1px solid var(--border);
      box-shadow: 
        0 0 0 1px rgba(167, 139, 250, 0.08),
        0 25px 50px -12px rgba(0, 0, 0, 0.6),
        0 0 80px -20px rgba(139, 92, 246, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: app-enter 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes app-enter {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .header {
      padding: 20px 22px 16px;
      background: linear-gradient(180deg, rgba(99, 102, 241, 0.12) 0%, transparent 100%);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
    }

    .avatar-wrap { position: relative; width: 52px; height: 52px; }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #ec4899, #22d3ee);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 0 24px rgba(139, 92, 246, 0.5);
      animation: avatar-pulse 2.5s ease-in-out infinite;
      position: relative;
      z-index: 1;
    }

    @keyframes avatar-pulse {
      0%, 100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); transform: scale(1); }
      50% { box-shadow: 0 0 32px rgba(236, 72, 153, 0.5); transform: scale(1.04); }
    }

    .status-dot {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 12px;
      height: 12px;
      background: var(--success);
      border-radius: 50%;
      border: 2px solid var(--bg-card);
      z-index: 2;
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .header-info h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #c4b5fd, #f0abfc, #67e8f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-info p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-info .online { color: var(--success); font-weight: 500; }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .chat::-webkit-scrollbar { width: 5px; }
    .chat::-webkit-scrollbar-track { background: transparent; }
    .chat::-webkit-scrollbar-thumb {
      background: rgba(167, 139, 250, 0.3);
      border-radius: 10px;
    }

    .msg {
      display: flex;
      gap: 10px;
      max-width: 88%;
      animation: msg-in 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes msg-in {
      from { opacity: 0; transform: translateY(16px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .msg.bot { align-self: flex-start; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .msg.user .msg-avatar { display: none; }

    .bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.55;
      position: relative;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.bot .bubble {
      background: var(--bg-bubble-bot);
      border: 1px solid rgba(167, 139, 250, 0.15);
      border-bottom-left-radius: 6px;
      color: #e2e8f0;
    }

    .msg.user .bubble {
      background: var(--bg-bubble-user);
      border-bottom-right-radius: 6px;
      color: white;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
    }

    .bubble strong { color: var(--accent-glow); }
    .msg.user .bubble strong { color: #fef3c7; }

    .bubble ul, .bubble ol {
      margin: 8px 0 4px 18px;
      padding: 0;
    }
    .bubble li { margin-bottom: 4px; }

    .typing {
      display: flex;
      gap: 10px;
      align-self: flex-start;
      max-width: 88%;
      animation: msg-in 0.3s ease;
    }

    .typing-dots {
      background: var(--bg-bubble-bot);
      border: 1px solid rgba(167, 139, 250, 0.15);
      border-radius: 18px;
      border-bottom-left-radius: 6px;
      padding: 14px 18px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .typing-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce-dot 1.4s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.16s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.32s; }

    @keyframes bounce-dot {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
      40% { transform: translateY(-6px); opacity: 1; }
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 18px 12px;
      animation: msg-in 0.5s ease 0.3s both;
    }

    .chip {
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(167, 139, 250, 0.25);
      color: var(--accent-glow);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      user-select: none;
    }

    .chip:hover {
      background: rgba(99, 102, 241, 0.25);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25);
    }

    .chip:active { transform: translateY(0); }

    .input-area {
      padding: 14px 16px 18px;
      border-top: 1px solid var(--border);
      background: linear-gradient(0deg, rgba(99, 102, 241, 0.06) 0%, transparent 100%);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .input-wrap { flex: 1; position: relative; }

    #userInput {
      width: 100%;
      background: rgba(30, 30, 46, 0.8);
      border: 1px solid rgba(167, 139, 250, 0.2);
      border-radius: 16px;
      padding: 14px 18px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    #userInput::placeholder { color: var(--text-muted); }

    #userInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.15);
    }

    .send-btn {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      flex-shrink: 0;
    }

    .send-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }

    .send-btn:active { transform: scale(0.96); }
    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .timestamp {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin: 4px 0 8px;
      animation: msg-in 0.4s ease;
    }

    .suggestion-card {
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(167, 139, 250, 0.2);
      border-radius: 12px;
      padding: 10px 12px;
      margin-top: 8px;
    }

    .suggestion-card .title {
      font-weight: 600;
      color: var(--accent-glow);
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    .suggestion-card .desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .error-note {
      font-size: 0.8rem;
      color: #f87171;
      margin-top: 6px;
      opacity: 0.9;
    }

    @media (max-width: 480px) {
      .app {
        max-width: 100%;
        height: 100vh;
        max-height: none;
        border-radius: 0;
      }
      body { align-items: stretch; }
    }
  </style>
</head>
<body>
  <div class="bg-particles" id="particles"></div>

  <div class="app">
    <header class="header">
      <div class="avatar-wrap">
        <div class="avatar">💡</div>
        <div class="status-dot"></div>
      </div>
      <div class="header-info">
        <h1>Tippy</h1>
        <p><span class="online">● Online</span> · AI-powered suggestions</p>
      </div>
    </header>

    <div class="chat" id="chat">
      <div class="timestamp">Today</div>
    </div>

    <div class="chips" id="chips">
      <div class="chip" data-msg="Suggest some food ideas">🍕 Food</div>
      <div class="chip" data-msg="Recommend a good book">📚 Books</div>
      <div class="chip" data-msg="Suggest an online course">🎓 Courses</div>
      <div class="chip" data-msg="Give me some job career ideas">💼 Jobs</div>
      <div class="chip" data-msg="Suggest something fun to do">🎮 Fun</div>
      <div class="chip" data-msg="Motivate me please">⚡ Motivation</div>
      <div class="chip" data-msg="Suggest some universities in California">🏫 Universities</div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <input type="text" id="userInput" placeholder="Ask Tippy anything..." autocomplete="off">
      </div>
      <button class="send-btn" id="sendBtn" title="Send">➤</button>
    </div>
  </div>

  <script>
    // Floating particles
    const particlesEl = document.getElementById('particles');
    for (let i = 0; i < 28; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDelay = Math.random() * 12 + 's';
      p.style.animationDuration = (10 + Math.random() * 10) + 's';
      particlesEl.appendChild(p);
    }

    const chat = document.getElementById('chat');
    const input = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const chips = document.getElementById('chips');

    // Conversation history for context
    const history = [
      {
        role: "system",
        content: `You are Tippy 💡, a friendly, upbeat, and helpful suggestion buddy chatbot.
Your personality: warm, encouraging, concise but useful, a little playful. Use light emojis when it fits.
You excel at giving practical suggestions for: food/recipes, books, courses, jobs/careers, fun activities, motivation, universities, travel, productivity, hobbies, and almost anything else.
When suggesting items, list 3-5 clear options with a short reason for each.
Keep answers helpful and not too long unless the user asks for detail.
If the user asks something outside suggestions (general knowledge, advice, etc.), still answer helpfully while staying in character as Tippy.
Never claim to be a different AI. You are Tippy.`
      }
    ];

    const greetings = [
      "Hey there! 👋 I'm <strong>Tippy</strong> — now powered by online AI. Ask me anything: food, books, universities, careers, motivation… or any question at all!",
      "Hello! ✨ Tippy here, fully online. Need suggestions or just want to chat about anything? I'm ready!",
      "Yo! 💡 Tippy at your service (with real AI brains now). What can I help you with today?"
    ];

    function pick(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function simpleMarkdown(text) {
      // Very light markdown → HTML for nicer bubbles
      let html = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      // bold
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      // simple lists
      html = html.replace(/^\s*[-•]\s+(.+)$/gm, '• $1');
      html = html.replace(/\n/g, '<br>');
      return html;
    }

    function addMessage(text, isUser = false) {
      const msg = document.createElement('div');
      msg.className = `msg ${isUser ? 'user' : 'bot'}`;
      
      if (!isUser) {
        const av = document.createElement('div');
        av.className = 'msg-avatar';
        av.textContent = '💡';
        msg.appendChild(av);
      }

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = isUser ? text.replace(/</g,'&lt;').replace(/>/g,'&gt;') : simpleMarkdown(text);
      msg.appendChild(bubble);
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    function showTyping() {
      const el = document.createElement('div');
      el.className = 'typing';
      el.id = 'typing';
      el.innerHTML = `
        <div class="msg-avatar">💡</div>
        <div class="typing-dots">
          <span></span><span></span><span></span>
        </div>
      `;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById('typing');
      if (el) el.remove();
    }

    async function callOnlineAI(userText) {
      history.push({ role: "user", content: userText });

      // Keep history reasonable
      if (history.length > 14) {
        // keep system + last 12 messages
        history.splice(1, history.length - 13);
      }

      const response = await fetch("https://api.llm7.io/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer unused"
        },
        body: JSON.stringify({
          model: "default",
          messages: history,
          temperature: 0.7,
          max_tokens: 800
        })
      });

      if (!response.ok) {
        throw new Error(`API error ${response.status}`);
      }

      const data = await response.json();
      const reply = data.choices?.[0]?.message?.content?.trim() || "Hmm, I couldn't think of a reply. Try again?";
      
      history.push({ role: "assistant", content: reply });
      return reply;
    }

    async function respond(userText) {
      sendBtn.disabled = true;
      showTyping();

      try {
        const reply = await callOnlineAI(userText);
        hideTyping();
        addMessage(reply, false);
      } catch (err) {
        console.error(err);
        hideTyping();
        addMessage(
          "Oops, my online connection hiccuped 😅<br><br>Try again in a moment, or ask something else!<br><span class='error-note'>Tip: Refresh the page if it keeps failing.</span>",
          false
        );
        // remove the last user message from history so retry works cleanly
        if (history.length && history[history.length - 1].role === "user") {
          history.pop();
        }
      }

      sendBtn.disabled = false;
      input.focus();
    }

    function handleSend() {
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, true);
      input.value = '';
      chips.style.display = 'none';
      respond(text);
    }

    sendBtn.addEventListener('click', handleSend);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleSend();
    });

    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const msg = chip.dataset.msg;
        addMessage(msg, true);
        chips.style.display = 'none';
        respond(msg);
      });
    });

    // Initial greeting
    setTimeout(() => {
      addMessage(pick(greetings), false);
    }, 500);
  </script>
</body>
</html>
